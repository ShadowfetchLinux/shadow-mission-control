<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1438"/>
      <stop offset="0.45" stop-color="#0e1017"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8cff"/>
      <stop offset="0.55" stop-color="#7b6cf6"/>
      <stop offset="1" stop-color="#4fd2e8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0.5" y1="0.5" x2="1" y2="0.15">
      <stop offset="0" stop-color="#7b6cf6" stop-opacity="0.70"/>
      <stop offset="0.55" stop-color="#6ad7ef" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6ad7ef" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0" stop-color="#7b6cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0e1017" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#plate)"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#glow)"/>
  <rect x="44" y="44" width="424" height="424" rx="104" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <rect x="62" y="62" width="388" height="388" rx="92" fill="none" stroke="#6ad7ef" stroke-opacity="0.16" stroke-width="2"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#b9b1ff" stroke-width="7" stroke-linecap="square" opacity="0.85">
    <path d="M118 148 V118 H148"/>
    <path d="M394 148 V118 H364"/>
    <path d="M118 364 V394 H148"/>
    <path d="M394 364 V394 H364"/>
  </g>

  <g transform="translate(256 256)" filter="url(#soft)">
    <circle r="132" fill="none" stroke="#2a3042" stroke-width="3"/>
    <circle r="92" fill="none" stroke="#3d3776" stroke-width="2.5"/>
    <circle r="52" fill="none" stroke="#6ad7ef" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M0 0 L118 -46 A128 128 0 0 0 28 -126 Z" fill="url(#sweep)"/>
    <g stroke="#cfd3e6" stroke-opacity="0.55" stroke-width="3">
      <line x1="0" y1="-148" x2="0" y2="-122"/>
      <line x1="0" y1="148" x2="0" y2="122"/>
      <line x1="-148" y1="0" x2="-122" y2="0"/>
      <line x1="148" y1="0" x2="122" y2="0"/>
    </g>
    <g stroke="#7b6cf6" stroke-width="2.5" stroke-opacity="0.9">
      <line x1="0" y1="-38" x2="0" y2="38"/>
      <line x1="-38" y1="0" x2="38" y2="0"/>
    </g>
    <circle r="8" fill="#6ad7ef"/>
    <circle r="8" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
