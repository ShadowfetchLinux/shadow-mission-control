[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-mission-control"
version = "1.0.0"
description = "Local-only system HUD for GPU, models, and host telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shadowfetch" }]
keywords = ["hud", "telemetry", "nvidia", "ollama", "linux"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.scripts]
shadow-mission-control-server = "server.app:main"

[project.urls]
Homepage = "https://github.com/Shadowfetchapps/shadow-mission-control"
Documentation = "https://github.com/Shadowfetchapps/shadow-mission-control#readme"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
